name: Build & Release

on:
  push:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Zip extensions
        run: |
          npm run zip
          npm run zip:firefox

      - name: Delete the previous "Prerelease" tag
        if: github.ref == 'refs/heads/main'
        run: gh release delete 'Prerelease' --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to "Prerelease"
        uses: svenstaro/upload-release-action@v2
        if: github.ref == 'refs/heads/main'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./.output/*
          tag: Prerelease
          overwrite: true
          file_glob: true
          prerelease: true

      - name: Upload binaries to prerelease
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.event.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./.output/*
          tag: ${{ github.head_ref || github.ref_name }}
          overwrite: true
          file_glob: true

      - name: Submit to stores
        if: startsWith(github.event.ref, 'refs/tags/')
        run: |
          npx wxt submit \
            --chrome-zip .output/*-chrome.zip \
            --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          CHROME_API_VERSION: 'v2'
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: '${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}'
          CHROME_SKIP_SUBMIT_REVIEW: 'false'
          CHROME_CANCEL_PENDING: 'true'
          CHROME_SKIP_REVIEW: 'false'
          CHROME_PUBLISH_TYPE: 'DEFAULT_PUBLISH'
          CHROME_DEPLOY_PERCENTAGE: '100'
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: 'listed'
          FIREFOX_SKIP_SUBMIT_REVIEW: 'false'
