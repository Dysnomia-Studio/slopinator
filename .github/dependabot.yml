version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GHP_TOKEN }}

updates:
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    registries: "*"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    target-branch: "develop"
    directory: "/"
    registries: "*"
    schedule:
      interval: "monthly"
